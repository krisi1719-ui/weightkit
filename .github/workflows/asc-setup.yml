# Sets the App Store Connect metadata through the API (texts, categories, age rating, screenshots,
# in-app purchases, availability). Prices and App Privacy are done in the website.
name: App Store metadata

on:
  workflow_dispatch:
    inputs:
      steps:
        description: What to update (meta,age,shots,iaps,availability)
        default: meta,age,shots,iaps,availability
      shot_type:
        description: Screenshot display type
        default: APP_IPHONE_67

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      APP_STORE_CONNECT_ISSUER_ID: c03b092c-a697-4603-9350-7f39fccc9c75
      APP_STORE_CONNECT_KEY_IDENTIFIER: H8TC4F4CTP
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      ASC_APP_ID: '6821445966'
      STEPS: ${{ inputs.steps }}
      SHOT_TYPE: ${{ inputs.shot_type }}
    steps:
      - uses: actions/checkout@v5
      - run: pip install pyjwt cryptography requests
      - run: mkdir -p out && python ci/asc_setup.py 2>&1 | tee out/asc_setup.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Publish output to branch ci-out/asc-setup
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cd out
          git init -q -b out && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "run ${{ github.run_id }}" --allow-empty
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" out:ci-out/asc-setup
