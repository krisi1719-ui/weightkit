# Fills App Review details and (when "submit" is ticked) submits the prepared iOS version for App Review.
name: App Store submit

on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the version for App Review (otherwise only update review details and report)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    env:
      APP_STORE_CONNECT_ISSUER_ID: c03b092c-a697-4603-9350-7f39fccc9c75
      APP_STORE_CONNECT_KEY_IDENTIFIER: H8TC4F4CTP
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      ASC_APP_ID: '6821445966'
      SUBMIT: ${{ inputs.submit }}
      REVIEW_FIRST_NAME: Kristian
      REVIEW_LAST_NAME: Hristov
      REVIEW_PHONE: '+359895729223'
      REVIEW_EMAIL: ggshoplimitedco@gmail.com
      REVIEW_NOTES: |
        WeightKit is a metal weight calculator. It works fully offline and needs no account or sign-in. To test: pick a shape (e.g. Sheet / plate or Standard profiles) on the Calculator tab, enter dimensions and see the weight; tap "Add to list", then open the Lists tab to see the cut list with totals and export a PDF or CSV.

        In-app purchases: "WeightKit Pro" (com.weightkit.app.pro) is a one-time non-consumable that unlocks saved lists, PDF quotes with company logo, client, VAT and notes, CSV export, price per metre or per piece, duplicating lists, backup and restore of lists, reverse calculation, all section tables and custom materials, and removes ads. "7-day Trial" (com.weightkit.app.trial14; the product ID is from the earlier 14-day version and cannot be changed) is a free non-consumable that starts a 7-day trial of the Pro features (guideline 3.1.1); the duration, what locks afterwards and the Pro price are shown before the trial starts. Both are in Settings > WeightKit Pro (also offered once on first launch), with Restore purchase on the same screen.

        Ads are served by Google AdMob in the free version only (no tracking, no ATT prompt, Google UMP consent where required).
    steps:
      - uses: actions/checkout@v5
      - run: pip install pyjwt cryptography requests
      - run: mkdir -p out && python ci/asc_submit.py 2>&1 | tee out/asc_submit.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Publish output to branch ci-out/asc-submit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cd out
          git init -q -b out && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "run ${{ github.run_id }}" --allow-empty
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" out:ci-out/asc-submit
